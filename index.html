<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- PAGE START -->
<title>Practice Keyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --ground: #dde2e6;
    --ink: #1b2026;
    --muted: #56616b;
    --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --ground: #101316;
      --ink: #e6e9ec;
      --muted: #909ba5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ground: #101316;
    --ink: #e6e9ec;
    --muted: #909ba5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 1240px;
    margin: 0 auto;
    padding-inline: 16px;
    padding-block: 28px 56px;
    display: grid;
    gap: 22px;
  }

  /* ---------- header ---------- */
  .top {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 24px;
  }
  .top h1 {
    margin: 0;
    font: italic 500 clamp(34px, 5vw, 48px)/1 var(--serif);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .top p { margin: 6px 0 0; color: var(--muted); max-width: 60ch; }
  .tuning {
    font: 500 11.5px/1.4 var(--mono);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- the instrument (fixed materials, same in both themes) ---------- */
  .case {
    background:
      linear-gradient(180deg, rgba(255,255,255,0.07) 0, rgba(255,255,255,0) 38%),
      linear-gradient(180deg, #25232a 0%, #141317 55%, #0c0b0e 100%);
    border-radius: 16px 16px 8px 8px;
    padding: 0 14px;
    box-shadow: 0 1px 0 rgba(255,255,255,0.08) inset, 0 24px 48px -20px rgba(0,0,0,0.55), 0 4px 10px rgba(0,0,0,0.25);
    color: #e9e2cf;
    overflow: hidden;
  }
  .fallboard {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 12px;
    padding: 16px 6px 14px;
  }
  .vol {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font: 500 10.5px/1 var(--mono);
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #978d74;
  }
  .vol input { width: 120px; accent-color: #c29a48; height: 28px; margin: 0; }
  .vol input:focus-visible { outline: 2px solid #e2c27a; outline-offset: 2px; }
  .nameplate {
    display: block;
    height: clamp(44px, 5.2vw, 64px);
    width: auto;
    aspect-ratio: 1920 / 968;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.6));
  }
  .readout {
    justify-self: end;
    font: 500 12px/1.2 var(--mono);
    color: #bdb39a;
    font-variant-numeric: tabular-nums;
    text-align: right;
    white-space: nowrap;
  }
  .readout b { color: #f3e6c2; font-weight: 500; font-size: 15px; margin-right: 8px; }

  .felt {
    height: 7px;
    margin-inline: -14px;
    background: linear-gradient(180deg, #6d1320, #9b2233 45%, #7a1824);
    box-shadow: 0 2px 3px rgba(0,0,0,.5);
    position: relative;
    z-index: 3;
  }
  .keybed {
    position: relative;
    height: clamp(170px, 23vw, 260px);
    margin-inline: -14px;
    background: #0b0a0c;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    cursor: pointer;
  }
  .key { position: absolute; top: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .key.white {
    bottom: 0;
    z-index: 1;
    padding-bottom: 10px;
    background: linear-gradient(180deg, #e9e5d9 0%, #fbfaf5 6%, #fdfcf8 80%, #efebe0 96%, #d9d4c5 100%);
    border-radius: 0 0 5px 5px;
    box-shadow: inset -1px 0 0 #c8c2b1, inset 1px 0 0 #fffefa, 0 2px 2px rgba(0,0,0,.35);
  }
  .key.white.down {
    background: linear-gradient(180deg, #d8ceb1 0%, #eadfc1 10%, #efe5c9 85%, #ddd1b1 100%);
    box-shadow: inset -1px 0 0 #bfb59a, inset 0 4px 7px rgba(60,40,0,.28);
  }
  .key.black {
    height: 62%;
    z-index: 2;
    background: linear-gradient(180deg, #1d1c20 0%, #2e2c31 70%, #151417 100%);
    border-radius: 0 0 4px 4px;
    box-shadow: inset 0 -8px 0 #38363b, inset 1px 0 0 #444147, inset -1px 0 0 #0a0a0b, 0 4px 5px rgba(0,0,0,.55);
  }
  .key.black.down {
    height: 61.2%;
    background: linear-gradient(180deg, #221f1a 0%, #3b3428 80%, #2a251d 100%);
    box-shadow: inset 0 -3px 0 #4a4234, inset 1px 0 0 #4b4538, 0 2px 3px rgba(0,0,0,.5);
  }
  .lbl-note { font: 500 10.5px/1 var(--mono); color: #938a74; letter-spacing: 0.02em; }
  .lbl-note.c { color: #6e5520; }
  .key.black { padding-bottom: 13px; }
  .lbl-black {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-size: 9.5px;
    color: #b9ae90;
    letter-spacing: 0;
  }
  .lbl-black span + span { padding-top: 3px; border-top: 1px solid #4a463f; }
  @media (max-width: 540px) { .lbl-black { font-size: 8.5px; } }

  @media (max-width: 640px) {
    .fallboard { grid-template-columns: 1fr auto; }
    .nameplate { display: none; }
    .vol input { width: 96px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <header class="top">
    <div>
      <h1>Practice Keyboard</h1>
      <p>A piano you can play in the browser. Click or drag across the keys, or use several fingers on a touchscreen. Nearer the front of a key plays louder.</p>
    </div>
    <span class="tuning">A4 = 440 Hz · equal temperament</span>
  </header>

  <section class="case" aria-label="Piano">
    <div class="fallboard">
      <label class="vol" for="vol">Volume <input id="vol" type="range" min="0" max="100" value="80"></label>
      <canvas class="nameplate" id="plate" role="img" aria-label="MMG"></canvas>
      <div class="readout" id="readout" aria-live="off"><b>—</b>play a key</div>
    </div>
    <div class="felt"></div>
    <div class="keybed" id="kb" role="group" aria-label="Piano keys"></div>
  </section>
</main>

<script>
(() => {
  'use strict';

  /* ---------------- music helpers ---------------- */
  const NAMES = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
  const FLATS = { 1: 'D♭', 3: 'E♭', 6: 'G♭', 8: 'A♭', 10: 'B♭' };
  const isBlack =m => [1, 3, 6, 8, 10].includes(m % 12);
  const noteName = m => NAMES[m % 12] + (Math.floor(m / 12) - 1);
  const freq = m => 440 * Math.pow(2, (m - 69) / 12);
  const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

  /* ---------------- audio engine ---------------- */
  let ctx = null, master, noiseBuf, wave;
  let volume = 0.8;

  function ensureAudio() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC({ latencyHint: 'interactive' });
    master = ctx.createGain();
    master.gain.value = volume;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -12; comp.knee.value = 10; comp.ratio.value = 5;
    comp.attack.value = 0.003; comp.release.value = 0.25;
    master.connect(comp); comp.connect(ctx.destination);

    // small room: synthetic impulse response
    const len = Math.floor(ctx.sampleRate * 2.0);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2);
    }
    const verb = ctx.createConvolver(); verb.buffer = ir;
    const wet = ctx.createGain(); wet.gain.value = 0.2;
    master.connect(verb); verb.connect(wet); wet.connect(comp);

    noiseBuf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.06), ctx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

    // Harmonics fall off with order; the 7th is weak because the hammer strikes near 1/7 of the string.
    const n = 24;
    const real = new Float32Array(n + 1), imag = new Float32Array(n + 1);
    for (let h = 1; h <= n; h++) imag[h] = (h % 7 === 0 ? 0.15 : 1) / Math.pow(h, 1.55);
    wave = ctx.createPeriodicWave(real, imag);
  }

  function buildVoice(m, vel) {
    const t = ctx.currentTime + 0.002;
    const f = freq(m);
    const out = ctx.createGain();
    out.gain.value = 0;
    if (ctx.createStereoPanner) {
      const pan = ctx.createStereoPanner();
      pan.pan.value = clamp((m - 60) / 48, -0.6, 0.6);
      out.connect(pan); pan.connect(master);
    } else out.connect(master);
    const srcs = [];

    const decay = clamp(5.5 * Math.pow(0.5, (m - 36) / 17), 0.35, 7);
    const filt = ctx.createBiquadFilter();
    filt.type = 'lowpass'; filt.Q.value = 0.4;
    filt.frequency.setValueAtTime(Math.min(16000, f * (3 + 13 * vel)), t);
    filt.frequency.setTargetAtTime(Math.min(14000, f * 1.8 + 250), t + 0.01, decay * 0.3);
    filt.connect(out);
    const detunes = m < 32 ? [0] : m < 44 ? [-2.5, 2.5] : [-3.2, 0.4, 3.6];
    detunes.forEach(d => {
      const o = ctx.createOscillator();
      o.setPeriodicWave(wave);
      o.frequency.value = f; o.detune.value = d;
      const og = ctx.createGain(); og.gain.value = 1 / detunes.length;
      o.connect(og); og.connect(filt);
      o.start(t); srcs.push(o);
    });
    // hammer thump
    const nz = ctx.createBufferSource(); nz.buffer = noiseBuf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = clamp(f * 3, 400, 7000); bp.Q.value = 1.2;
    const ng = ctx.createGain();
    ng.gain.setValueAtTime(0.12 * vel, t);
    ng.gain.setTargetAtTime(0, t + 0.002, 0.012);
    nz.connect(bp); bp.connect(ng); ng.connect(out);
    nz.start(t); srcs.push(nz);

    const peak = 0.28 * Math.pow(vel, 1.4) * (m > 84 ? 0.8 : 1);
    out.gain.setValueAtTime(0, t);
    out.gain.linearRampToValueAtTime(peak, t + 0.004);
    out.gain.setTargetAtTime(peak * 0.42, t + 0.004, 0.14);
    out.gain.setTargetAtTime(0, t + 0.3, decay);
    srcs.forEach(s => s.stop(t + 0.3 + decay * 7));
    const releaseTime = m > 88 ? 0.35 : 0.09;   // top octave has no dampers on a real grand

    return {
      release(fast) {
        const now = ctx.currentTime;
        const rt = fast ? 0.02 : releaseTime;
        const gp = out.gain;
        if (gp.cancelAndHoldAtTime) gp.cancelAndHoldAtTime(now);
        else { const v = gp.value; gp.cancelScheduledValues(now); gp.setValueAtTime(v, now); }
        gp.setTargetAtTime(0, now, rt);
        srcs.forEach(s => { try { s.stop(now + rt * 8 + 0.05); } catch (e) {} });
      }
    };
  }

  /* ---------------- note state ---------------- */
  const voices = new Map();   // midi -> voice
  const held = new Map();     // midi -> number of pointers holding it down
  let keyEls = new Map();
  const readoutEl = document.getElementById('readout');

  function noteOn(m, vel) {
    ensureAudio();
    held.set(m, (held.get(m) || 0) + 1);
    if (ctx) {
      voices.get(m)?.release(true);
      voices.set(m, buildVoice(m, vel));
    }
    keyEls.get(m)?.classList.add('down');
    readoutEl.innerHTML = '<b>' + noteName(m) + '</b>' + freq(m).toFixed(2) + ' Hz · MIDI ' + m;
  }

  function noteOff(m) {
    const n = (held.get(m) || 0) - 1;
    if (n > 0) { held.set(m, n); return; }
    held.delete(m);
    keyEls.get(m)?.classList.remove('down');
    voices.get(m)?.release(false);
    voices.delete(m);
  }

  /* ---------------- keyboard rendering ---------------- */
  const kb = document.getElementById('kb');
  const BLACK_OFFSET = { 1: -0.12, 3: 0.12, 6: -0.14, 8: 0, 10: 0.14 };
  let octaves = 0;

  // Keep middle C (C4) near the centre: 5 octaves C2–C7, 4 C2–C6, 3 C3–C6, 2 C3–C5.
  function visibleRange() {
    const start = octaves >= 4 ? 2 : 3;
    return [12 * (start + 1), 12 * (start + 1 + octaves)];
  }

  function renderKeys() {
    const [lo, hi] = visibleRange();
    let whites = 0;
    for (let m = lo; m <= hi; m++) if (!isBlack(m)) whites++;
    const ww = 100 / whites;
    const bw = ww * 0.6;
    const frag = document.createDocumentFragment();
    keyEls = new Map();
    let wi = 0;
    for (let m = lo; m <= hi; m++) {
      const el = document.createElement('div');
      const black = isBlack(m);
      el.className = 'key ' + (black ? 'black' : 'white') + (held.has(m) ? ' down' : '');
      el.dataset.midi = m;
      if (black) {
        el.style.left = (wi * ww - bw / 2 + BLACK_OFFSET[m % 12] * bw) + '%';
        el.style.width = bw + '%';
        const n = document.createElement('span');
        n.className = 'lbl-note lbl-black';
        n.innerHTML = '<span>' + NAMES[m % 12] + '</span><span>' + FLATS[m % 12] + '</span>';
        el.appendChild(n);
      } else {
        el.style.left = (wi * ww) + '%';
        el.style.width = ww + '%';
        wi++;
        const n = document.createElement('span');
        const isC = m % 12 === 0;
        n.className = 'lbl-note' + (isC ? ' c' : '');
        n.textContent = isC ? noteName(m) : NAMES[m % 12];
        el.appendChild(n);
      }
      el.setAttribute('aria-label', noteName(m));
      frag.appendChild(el);
      keyEls.set(m, el);
    }
    kb.replaceChildren(frag);
  }

  function fitOctaves() {
    const w = kb.clientWidth;
    const n = w >= 1100 ? 5 : w >= 800 ? 4 : w >= 540 ? 3 : 2;
    if (n !== octaves) { octaves = n; renderKeys(); }
  }

  /* ---------------- pointer: click, drag (glissando), multi-touch ---------------- */
  const pointers = new Map(); // pointerId -> midi
  function keyAt(x, y) {
    const el = document.elementFromPoint(x, y);
    return el && el.closest ? el.closest('.key') : null;
  }
  function velFrom(el, y) {
    const r = el.getBoundingClientRect();
    return clamp(0.35 + 0.65 * ((y - r.top) / r.height), 0.3, 1);
  }
  kb.addEventListener('pointerdown', e => {
    const el = e.target.closest('.key');
    if (!el) return;
    e.preventDefault();
    try { kb.setPointerCapture(e.pointerId); } catch (err) {}
    const m = +el.dataset.midi;
    pointers.set(e.pointerId, m);
    noteOn(m, velFrom(el, e.clientY));
  });
  kb.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;
    const el = keyAt(e.clientX, e.clientY);
    const m = el ? +el.dataset.midi : null;
    const prev = pointers.get(e.pointerId);
    if (m === prev) return;
    if (prev != null) noteOff(prev);
    pointers.set(e.pointerId, m);
    if (m != null) noteOn(m, velFrom(el, e.clientY) * 0.9);
  });
  const endPointer = e => {
    if (!pointers.has(e.pointerId)) return;
    const m = pointers.get(e.pointerId);
    pointers.delete(e.pointerId);
    if (m != null) noteOff(m);
  };
  kb.addEventListener('pointerup', endPointer);
  kb.addEventListener('pointercancel', endPointer);
  kb.addEventListener('lostpointercapture', endPointer);
  kb.addEventListener('contextmenu', e => e.preventDefault());

  /* ---------------- volume ---------------- */
  const volEl = document.getElementById('vol');
  volEl.addEventListener('input', () => {
    volume = volEl.value / 100;
    if (master) master.gain.setTargetAtTime(volume, ctx.currentTime, 0.02);
  });

  /* ---------------- nameplate logo ---------------- */
